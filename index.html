
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Personal Task Tracker</title>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        li {
            margin: 10px;
        }

        button {
            margin-left: 10px;
        }
    </style>

    <script src="task-manager.js" defer></script>
</head>

<body>

    <h1>Personal Task Tracker</h1>

    <h2>Add a New Task</h2>

    <input
        type="text"
        id="taskInput"
        placeholder="Enter your task"
    >

    <button id="addButton">Add Task</button>

    <h2>My Tasks</h2>

    <ul id="taskList"></ul>

</body>
</html>
